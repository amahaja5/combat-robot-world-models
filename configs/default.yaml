# Default training configuration for Combat Robot World Models

# Model architecture
model:
  latent_dim: 512          # VAE latent space dimension
  action_dim: 3            # Action vector dimension [flow_x, flow_y, frame_diff]
  hidden_dim: 256          # Hidden dimension for transformers
  num_layers: 4            # Number of transformer layers

# Training settings
training:
  batch_size: 2            # Batch size (adjust based on GPU memory)
  epochs: 10               # Number of training epochs
  learning_rate: 1.0e-4    # Learning rate
  weight_decay: 1.0e-5     # L2 regularization
  mixed_precision: true    # Use FP16 mixed precision
  gradient_clip: 1.0       # Gradient clipping threshold

# Data settings
data:
  video_fps: 10            # Target frames per second
  resolution: [256, 256]   # Image resolution [width, height]
  sequence_length: 16      # Number of frames per sequence
  train_split: 0.8         # Fraction of data for training
  val_split: 0.1           # Fraction of data for validation
  test_split: 0.1          # Fraction of data for testing

# Optimization
optimizer:
  type: "adamw"            # Optimizer type
  betas: [0.9, 0.999]      # Adam betas
  eps: 1.0e-8              # Adam epsilon

# Scheduler
scheduler:
  type: "cosine"           # Learning rate scheduler
  warmup_steps: 1000       # Number of warmup steps
  min_lr: 1.0e-6           # Minimum learning rate

# Loss weights
loss:
  reconstruction_weight: 1.0   # Weight for reconstruction loss
  action_weight: 0.1           # Weight for action prediction loss

# Logging
logging:
  log_interval: 10         # Log every N batches
  save_interval: 1000      # Save checkpoint every N batches
  wandb_project: "combat-robot-world-models"
  wandb_enabled: false     # Enable Weights & Biases logging

# Hardware
hardware:
  device: "cuda"           # Device to use (cuda/cpu)
  num_workers: 4           # DataLoader workers
  pin_memory: true         # Pin memory for faster GPU transfer

# Paths
paths:
  data_dir: "data/processed"
  output_dir: "models"
  checkpoint_dir: "models/checkpoints"
